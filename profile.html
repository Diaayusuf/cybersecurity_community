<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="image/CYBERX-LOGO2.png" type="image/png" />
    <title>CyberX | Profile</title>
    <link rel="stylesheet" href="assets/css/cyberx-ui.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-inner">
        <a class="brand" href="index.html" aria-label="CyberX home">
          <img src="image/CYBERX-LOGO2.png" alt="CYBERX logo" />
        </a>
        <nav class="nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="learning.html">Learning</a>
          <a href="puzzle.html">Puzzle Arena</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="pricing.html">Pricing</a>
          <a href="auth.html">Sign in</a>
          <a href="profile.html" class="active nav-cta">Profile</a>
        </nav>
        <button class="mobile-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">☰</button>
      </div>
      <div class="mobile-menu">
        <a href="index.html">Home</a>
        <a href="learning.html">Learning</a>
        <a href="puzzle.html">Puzzle Arena</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="pricing.html">Pricing</a>
        <a href="auth.html">Sign in</a>
      </div>
    </header>

    <main class="page-shell profile-shell">
      <section class="page-header compact">
        <div class="kicker">Profile</div>
        <h1>Operator identity</h1>
      </section>

      <p class="notice warning" data-profile-access-note hidden>
        Sign in to view your account settings. <a href="auth.html">Go to sign in</a>.
      </p>

      <div class="split-grid" data-profile-content hidden>
        <div class="pad-card profile-card">
          <div class="avatar-ring" data-profile-initials>CX</div>
          <h2 data-profile-display-name>Member</h2>
          <div class="meta-row small"><span data-profile-handle></span><span data-profile-headline></span></div>
          <div class="profile-badges">
            <span class="pill">CyberX member</span>
          </div>
        </div>

        <div class="pad-card form">
          <div class="section-heading">
            <h2>Account settings</h2>
            <button class="btn btn-secondary" type="button" data-auth-signout>Sign out</button>
          </div>
          <form data-profile-form novalidate>
            <div class="field">
              <label for="profile-name">Display name</label>
              <input id="profile-name" name="display_name" type="text" maxlength="48" required />
            </div>
            <div class="field">
              <label for="profile-handle">Username</label>
              <input id="profile-handle" name="handle" type="text" maxlength="32" required />
            </div>
            <div class="field">
              <label for="profile-role">Headline</label>
              <input id="profile-role" name="headline" type="text" maxlength="64" />
            </div>
            <div class="field">
              <label for="profile-bio">Bio</label>
              <textarea id="profile-bio" name="bio" rows="4" maxlength="500"></textarea>
            </div>
            <button class="btn btn-primary" type="submit">Save profile</button>
            <p class="notice" data-profile-status role="status" aria-live="polite" hidden></p>
          </form>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/cyberx-local-config.js"></script>
    <script src="assets/js/cyberx-backend.js"></script>
    <script src="assets/js/cyberx-app.js"></script>
  </body>
</html>
